kind = "mobile"
previewPath = "/"
title = "مصروفي"
version = "1.0.0"
id = "artifacts/masroofy"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/" ]
localPort = 18402

[services.development]
run = "pnpm --filter @workspace/masroofy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/masroofy", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/masroofy", "run", "serve" ]

[services.env]
PORT = "18402"
BASE_PATH = "/"
