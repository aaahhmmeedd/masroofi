kind = "mobile"
previewPath = "/masroofy/"
title = "مصروفي"
version = "1.0.0"
id = "artifacts/masroofy"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/masroofy/" ]
localPort = 18402

[services.development]
run = "pnpm --filter @workspace/masroofy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/masroofy", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/masroofy", "run", "serve" ]

[services.env]
PORT = "18402"
BASE_PATH = "/masroofy/"
